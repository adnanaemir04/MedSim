version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medsim-postgres
    environment:
      POSTGRES_USER: adnanemir
      POSTGRES_PASSWORD: "123456789"
      POSTGRES_DB: medsim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adnanemir -d medsim"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: medsim-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: medsim-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=medsim;Username=adnanemir;Password=123456789
      - ConnectionStrings__RedisConnection=redis:6379,abortConnect=false
    ports:
      - "5211:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: medsim-frontend
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  redis_data:
  postgres_data:
